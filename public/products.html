<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/veloxcore-logo.png">
  <title>제품 가격 | 복구봇 관리</title>
  <link rel="stylesheet" href="/assets/style.css?v=toast-hover-title-1">
  <script src="/assets/app.js?v=products-remove-host-column-1" defer></script>
</head>
<body data-page="products">
  <header class="topbar"><a class="brand" href="/" aria-label="메인 페이지"><img src="/assets/veloxcore-logo.png" alt=""><span>𝗩𝗲𝗹𝗼𝘅𝗰𝗼𝗿𝗲 𝗥𝗲𝗰𝗼𝘃𝗲𝗿𝘆</span></a><div class="top-actions"><span id="admin-name"></span><button class="button-quiet" data-logout>로그아웃</button></div></header>
  <div class="layout">
    <nav class="sidebar"><a href="/">메인페이지</a><a href="/hosts">호기 설정</a><a href="/recovery">복구 실행</a><a class="active" href="/products">제품 가격</a><a href="/licenses">라이선스</a><a href="/auto-recharge">자동충전 설정</a><a href="/data">DB 데이터 관리</a></nav>
    <main class="content">
      <p class="eyebrow">PRODUCT PRICING</p><h1>제품 가격</h1>
      <section class="panel">
        <div class="product-list-heading"><div><h2>판매 상품</h2><p id="products-count" class="muted">0개</p></div><label class="product-search">검색<input id="products-search" type="search" placeholder="상품명 검색"></label></div>
        <p id="products-message" class="message" role="status"></p>
        <div class="table-wrap"><table><thead><tr><th>상품명</th><th>가격</th><th>라이선스 기한</th><th>상태</th><th>생성일</th><th>관리</th></tr></thead><tbody id="products-rows"></tbody></table></div>
      </section>
    </main>
  </div>
  <dialog id="product-price-dialog" class="panel product-price-dialog" aria-labelledby="product-price-title">
    <form id="product-price-form">
      <h2 id="product-price-title">상품 가격 수정</h2>
      <p id="product-price-name" class="muted"></p>
      <label>가격 (원)<input name="priceMinor" type="number" min="1" step="1" required></label>
      <div class="product-price-dialog-actions"><button type="button" class="button-quiet" data-close-price-dialog>취소</button><button type="submit">저장</button></div>
    </form>
  </dialog>
</body>
</html>
